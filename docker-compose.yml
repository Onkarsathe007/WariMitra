services:
  redis:
    image: redis:7-alpine
    container_name: visava-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - visava-network
    restart: unless-stopped

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: visava-core-api
    ports:
      - "3000:3000"
    depends_on:
      - redis
    env_file:
      - ./core-api/.env
    environment:
      REDIS_URL: redis://redis:6379
      GEO_SERVICE_URL: http://geo-service:8081
    networks:
      - visava-network
    restart: unless-stopped

  geo-service:
    build:
      context: ./geo-service
      dockerfile: Dockerfile
    container_name: visava-geo-service
    ports:
      - "8081:8081"
    depends_on:
      - redis
    env_file:
      - ./geo-service/.env
    environment:
      REDIS_URL: redis://redis:6379
    networks:
      - visava-network
    restart: unless-stopped

  voice-agent:
    build:
      context: ./voice-agent
      dockerfile: Dockerfile
    container_name: visava-voice-agent
    ports:
      - "4000:4000"
      - "4001:4001"
    depends_on:
      - core-api
    env_file:
      - ./voice-agent/.env
    environment:
      CORE_API_URL: http://core-api:3000
    networks:
      - visava-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visava-frontend
    ports:
      - "80:80"
    depends_on:
      - core-api
      - voice-agent
    networks:
      - visava-network
    restart: unless-stopped

networks:
  visava-network:
    driver: bridge

volumes:
  redis_data:
